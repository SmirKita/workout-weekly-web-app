name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply startup patch before build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/scripts/app.js';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            '\nlet lastCloudSyncPayload = null;\nmigrateWeeklyResults();\nconst baseUrl = import.meta.env.BASE_URL;',
            '\nlet lastCloudSyncPayload = null;\nconst baseUrl = import.meta.env.BASE_URL;',
          );
          source = source.replace(
            'bodyMetrics = loadBodyMetrics();\n\nfunction weekStartFor(date) {',
            'bodyMetrics = loadBodyMetrics();\nmigrateWeeklyResults();\n\nfunction weekStartFor(date) {',
          );
          source = source.replace(
            'saveJson(exerciseResultsStorageKey, migrated.results);',
            'localStorage.setItem(exerciseResultsStorageKey, JSON.stringify(migrated.results));',
          );
          fs.writeFileSync(file, source);
          NODE

      - name: Commit startup patch if needed
        run: |
          if git diff --quiet src/scripts/app.js; then
            echo "Startup patch already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/app.js
          git commit -m "Fix app startup migration"
          git push

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
